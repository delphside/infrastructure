# Infrastructure's technical profile: the facts about this repository that the
# programme's tooling asks for (programme/scripts/board/profile.py). What the
# programme's processes need to know about the application is its programme
# profile, 3.3.6 in the programme repository. The hosts are listed in each
# hosted application's own profile, under `[hosts.*]`.

# The application's folder in the programme repository's `applications/`.
application = "infrastructure"

[documents]
# The document map, generated by programme/scripts/docs/document-map.py.
generated = ["docs/6.1.6-document-map.md"]
map = "docs/6.1.6-document-map.md"
# What the markdown linter skips, besides the programme's own folders.
lint_ignore = ["#programme"]

[hooks]
# No checks of its own yet.
check_docs = []
